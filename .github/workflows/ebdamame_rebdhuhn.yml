name: Run EBD_amame and r_EBD_huhn
on:
  push:
    branches:
      - master
    paths:
      - 'edi_energy_de/**/*.docx'
      - 'ebd-tooling/**'
      - '.github/workflows/ebdamame_rebdhuhn.yml'
jobs:
  check:
    name: Scrape ${{ matrix.output }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - output: FV2510
          - output: FV2604
          - output: FV2610
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          path: edi_energy_mirror
          lfs: true
      - uses: actions/checkout@v7
        with:
          # token expires 2026-05-16; has repo and read:packages scope
          token: ${{ secrets.MREBD_PUSH_TOKEN }}
          repository: Hochfrequenz/machine-readable_entscheidungsbaumdiagramme
          path: machine-readable_entscheidungsbaumdiagramme
      - name: login to GHCR
        # token expires 2026-05-16; has repo and read:package scope
        run: echo "${{ secrets.GHCR_PWD }}" | docker login ghcr.io -u ${{ secrets.GHCR_USR }} --password-stdin
      - name: Find latest EBD docx
        id: find-ebd
        # The file name is not hardcoded but derived from the naming convention that
        # edi_energy_scraper applies when it mirrors the BDEW documents into this repository, see
        # Document.get_meaningful_file_name():
        # https://github.com/Hochfrequenz/edi_energy_scraper/blob/b04c2be5aeecbdef5870558e5cd54b634c6274f4/src/edi_energy_scraper/apidocument.py#L238
        #   "{kind}_{edifact_format}{version}_{from_date}_{to_date}_{publication_date}_{flags}_{id}.{extension}"
        # {edifact_format} is empty for EBD documents, so the names read:
        #   EBD_{version}_{valid_from}_{valid_to}_{publication_date}_{flags}_{id}.docx
        # ⚠️ This step only works as long as that format string stays exactly the way it is. If
        # get_meaningful_file_name() ever changes (field order, the "_" separator, or the trailing
        # document id), this step has to be adapted, too. It warns about and skips every EBD_*.docx
        # that does not match the pattern, so an upstream convention change shows up in the job log
        # instead of silently picking the wrong document.
        #
        # How the "latest" document is chosen: among the documents whose validity starts within this
        # format version, take the one with the highest BDEW document id. That id is a per-file
        # counter of the BDEW system, so the highest id is the most recently added document.
        # Sorting by the dates in the file name would be worse: {publication_date} falls back to
        # {valid_from} whenever the API reports no publication date (which is the case for every
        # "informatorische Lesefassung", i.e. for practically every .docx in this mirror), and
        # {valid_to} is occasionally even before {valid_from} in the source data.
        # Restricting to the format version's own validity window is what keeps this honest: FV
        # directories have contained documents of the *following* format version before (e.g. an
        # EBD 4.2 document inside edi_energy_de/FV2510), which a plain max(id) over the directory
        # would sooner or later pick up. The window bounds come from efoli, i.e. from the
        # authoritative BDEW dates, not from the FV label.
        # Known limitation: the document id cannot distinguish an "außerordentliche
        # Veröffentlichung" or a "Fehlerkorrektur" from a regular publication. It does reproduce the
        # paths that used to be hardcoded here for all three format versions.
        env:
          FORMAT_VERSION: ${{ matrix.output }}
          FV_DIR: edi_energy_mirror/edi_energy_de/${{ matrix.output }}
        run: |
          python3 -m pip install --quiet efoli
          python3 <<'PY'
          import os
          import re
          import sys
          from datetime import date
          from pathlib import Path

          from efoli import EdifactFormatVersion, get_edifact_format_version_valid_from

          format_version = os.environ["FORMAT_VERSION"]
          fv_dir = Path(os.environ["FV_DIR"])

          # keep in sync with get_meaningful_file_name(), see the comment above this script
          ebd_docx_pattern = re.compile(
              r"^EBD_(?P<version>[^_]+)"
              r"_(?P<valid_from>\d{8})_(?P<valid_to>\d{8})_(?P<publication_date>\d{8})"
              r"_(?P<flags>[xo]{4})_(?P<file_id>\d+)\.docx$"
          )

          def valid_from_of(fv: EdifactFormatVersion) -> date | None:
              try:
                  return get_edifact_format_version_valid_from(fv)
              except (KeyError, ValueError):
                  return None  # format version not (yet) known to efoli

          def validity_window(fv: str) -> tuple[date, date | None]:
              """[valid_from of fv, valid_from of the format version following fv)"""
              start = get_edifact_format_version_valid_from(EdifactFormatVersion(fv))
              later = sorted(
                  s for s in {valid_from_of(other) for other in EdifactFormatVersion} if s and s > start
              )
              return start, (later[0] if later else None)

          def parse_date(yyyymmdd: str) -> date:
              return date(int(yyyymmdd[:4]), int(yyyymmdd[4:6]), int(yyyymmdd[6:8]))

          candidates = []
          for path in sorted(fv_dir.glob("EBD_*.docx")):
              match = ebd_docx_pattern.match(path.name)
              if match is None:
                  print(f"::warning::Ignoring {path.name}: does not match the EBD naming convention")
                  continue
              candidates.append((int(match.group("file_id")), parse_date(match.group("valid_from")), path))

          if not candidates:
              print(f"::error::No EBD *.docx matching the naming convention found in {fv_dir}")
              sys.exit(1)

          fv_start, fv_end = validity_window(format_version)
          in_window = [c for c in candidates if fv_start <= c[1] and (fv_end is None or c[1] < fv_end)]
          if in_window:
              candidates = in_window
          else:
              # happens for a brand new format version directory that has no own EBD document yet;
              # extracting *something* loudly beats failing the whole job
              print(
                  f"::warning::No EBD *.docx in {fv_dir} starts its validity within {format_version} "
                  f"({fv_start} .. {fv_end or 'open end'}); falling back to the highest document id"
              )

          file_id, valid_from, path = max(candidates, key=lambda candidate: candidate[0])
          print(f"Latest EBD docx for {format_version}: {path.name} (id {file_id}, valid from {valid_from})")

          # EBD_DOCX_FILE is consumed with working-directory: edi_energy_mirror/ebd-tooling,
          # hence the path has to be relative to that directory
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
              github_output.write(f"docx=../edi_energy_de/{format_version}/{path.name}\n")
          PY
      - name: Run Extraction
        working-directory: edi_energy_mirror/ebd-tooling
        env:
          EBD_DOCX_FILE: ${{ steps.find-ebd.outputs.docx }}
          OUTPUT_DIR: ../../machine-readable_entscheidungsbaumdiagramme/${{ matrix.output }}
          GITHUB_TOKEN: ${{ secrets.XMLMIGSAHBS_READ_TOKEN }}
          FORMAT_VERSION: ${{ matrix.output }}
        run: docker compose up --abort-on-container-exit
      - name: Regenerate format_versions.json (enumerable FV list for AI/consumers)
        # ebd_toolchain emits the per-FV discovery files (index.json / pruefi_to_key.json /
        # ebd.schema.json) into each FV dir; this adds the one cross-FV manifest, which no single
        # (per-FV) matrix job can otherwise produce. We list the FV dirs present in the checkout
        # (this job's freshly-written FV included) and take valid_from from efoli — the authoritative
        # BDEW dates, which are NOT the FV label and not always the 1st (e.g. FV2504 -> 2025-06-06).
        # Existing-FV jobs recompute an identical manifest, so create-pull-request includes it only in
        # the PR of the job that actually adds/changes a format version; it self-heals on the next run.
        working-directory: machine-readable_entscheidungsbaumdiagramme
        run: |
          python3 -m pip install --quiet efoli
          python3 <<'PY'
          import json, os, re
          from efoli import EdifactFormatVersion, get_edifact_format_version_valid_from
          fvs = sorted(d for d in os.listdir(".") if re.fullmatch(r"FV\d{4}", d) and os.path.isdir(d))
          def valid_from(fv: str) -> str | None:
              try:
                  return get_edifact_format_version_valid_from(EdifactFormatVersion(fv)).isoformat()
              except ValueError:
                  return None  # FV not (yet) known to efoli
          data = {
              "latest": fvs[-1] if fvs else None,
              "format_versions": [{"format_version": fv, "valid_from": valid_from(fv)} for fv in fvs],
          }
          with open("format_versions.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(f"wrote format_versions.json with {len(fvs)} format versions")
          PY
      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          # we use this to have unique branch names
      - name: Push EBD files to machine-readable_entscheidungsbaumdiagramme
        uses: peter-evans/create-pull-request@v8
        with:
           path:  machine-readable_entscheidungsbaumdiagramme
           title: EDI@Energy ebd_amame & r_ebd_huhn changes (Triggered by ${{ github.event.head_commit.message }})
           token: ${{ secrets.MREBD_PUSH_TOKEN }} # this token expires on 2025-10-27
           # token with repo scope
           # https://github.com/Hochfrequenz/edi_energy_mirror/settings/secrets/actions/MREBD_PUSH_TOKEN
           branch: update-${{ steps.current-time.outputs.formattedTime }}
           reviewers: deltadaniel
           assignees: deltadaniel
