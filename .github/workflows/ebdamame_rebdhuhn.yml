name: Run EBD_amame and r_EBD_huhn
on:
  push:
    branches:
      - master
    paths:
      - 'edi_energy_de/**/*.docx'
      - 'ebd-tooling/**'
      - '.github/workflows/ebdamame_rebdhuhn.yml'
jobs:
  check:
    name: Scrape ${{ matrix.output }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - output: FV2510
          - output: FV2604
          - output: FV2610
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          path: edi_energy_mirror
          lfs: true
      - uses: actions/checkout@v7
        with:
          # token expires 2026-05-16; has repo and read:packages scope
          token: ${{ secrets.MREBD_PUSH_TOKEN }}
          repository: Hochfrequenz/machine-readable_entscheidungsbaumdiagramme
          path: machine-readable_entscheidungsbaumdiagramme
      - name: login to GHCR
        # token expires 2026-05-16; has repo and read:package scope
        run: echo "${{ secrets.GHCR_PWD }}" | docker login ghcr.io -u ${{ secrets.GHCR_USR }} --password-stdin
      - name: Find latest EBD docx
        id: find-ebd
        # The path is not hardcoded but derived from the file metadata, using the two libraries that
        # own that knowledge instead of re-implementing it here:
        #   * edi_energy_scraper writes these file names (Document.get_meaningful_file_name()) and
        #     reads them back (DocumentMetadata.from_filename()), so the naming convention stays a
        #     versioned API of the scraper. If the convention ever changes, from_filename() changes
        #     with it and this step keeps working -- no pattern duplicated here that could silently
        #     rot. See https://github.com/Hochfrequenz/edi_energy_scraper/blob/b04c2be5aeecbdef5870558e5cd54b634c6274f4/src/edi_energy_scraper/apidocument.py#L238
        #   * efoli maps a date to the format version valid at that date, which is how we tell
        #     whether a document in edi_energy_de/FVxxxx really belongs to FVxxxx. That matters
        #     because the scraper mirrors a document into *every* format version it is valid in
        #     (download_document_for_all_fv), so an FV directory legitimately contains documents of
        #     neighbouring format versions.
        #
        # Among the documents that belong to this format version we take the highest BDEW document
        # id. That id is a per-file counter of the BDEW system, so the highest id is the most
        # recently added document. The dates in the name are the worse criterion: publication_date
        # falls back to valid_from whenever the API reports none (which is the case for every
        # "informatorische Lesefassung", i.e. practically every .docx here) and valid_until is
        # occasionally even before valid_from in the source data.
        # Known limitation: the document id cannot distinguish an "außerordentliche
        # Veröffentlichung" or a "Fehlerkorrektur" from a regular publication.
        env:
          FORMAT_VERSION: ${{ matrix.output }}
          FV_DIR: edi_energy_mirror/edi_energy_de/${{ matrix.output }}
        run: |
          python3 -m pip install --quiet efoli edi_energy_scraper
          python3 <<'PY'
          import os
          import sys
          from pathlib import Path

          from edi_energy_scraper import DocumentMetadata
          from efoli import EdifactFormatVersion, get_edifact_format_version

          format_version = os.environ["FORMAT_VERSION"]
          fv_dir = Path(os.environ["FV_DIR"])

          # efoli only learns about a new format version with a new release, so it can lag behind a
          # newly added matrix entry. In that case we cannot verify what a document belongs to.
          efoli_knows_format_version = format_version in {fv.value for fv in EdifactFormatVersion}
          if not efoli_knows_format_version:
              print(
                  f"::warning::{format_version} is unknown to the installed efoli version, so the "
                  f"documents in {fv_dir} cannot be checked against it; taking the highest document id"
              )

          candidates = []
          for path in sorted(fv_dir.glob("EBD_*.docx")):
              try:
                  metadata = DocumentMetadata.from_filename(path)
              except (ValueError, IndexError) as error:
                  # not named by get_meaningful_file_name() (or the convention changed)
                  print(f"::warning::Ignoring {path.name}, cannot read its metadata: {error}")
                  continue
              if efoli_knows_format_version:
                  belongs_to = get_edifact_format_version(metadata.valid_from).value
                  if belongs_to != format_version:
                      print(f"Skipping {path.name}: valid from {metadata.valid_from}, i.e. {belongs_to}")
                      continue
              candidates.append((metadata.id, path))

          if not candidates:
              # Do not guess: extracting another format version's EBDs would silently open a
              # plausible looking pull request against machine-readable_entscheidungsbaumdiagramme.
              print(
                  f"::error::No EBD *.docx belonging to {format_version} found in {fv_dir}. Either "
                  f"the mirror has not received the {format_version} EBD document yet, or the "
                  f"documents landed in the wrong directory."
              )
              sys.exit(1)

          document_id, path = max(candidates)
          print(f"Latest EBD docx for {format_version}: {path.name} (document id {document_id})")

          # EBD_DOCX_FILE is consumed with working-directory: edi_energy_mirror/ebd-tooling,
          # hence the path has to be relative to that directory
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
              github_output.write(f"docx=../edi_energy_de/{format_version}/{path.name}\n")
          PY
      - name: Run Extraction
        working-directory: edi_energy_mirror/ebd-tooling
        env:
          EBD_DOCX_FILE: ${{ steps.find-ebd.outputs.docx }}
          OUTPUT_DIR: ../../machine-readable_entscheidungsbaumdiagramme/${{ matrix.output }}
          GITHUB_TOKEN: ${{ secrets.XMLMIGSAHBS_READ_TOKEN }}
          FORMAT_VERSION: ${{ matrix.output }}
        run: docker compose up --abort-on-container-exit
      - name: Regenerate format_versions.json (enumerable FV list for AI/consumers)
        # ebd_toolchain emits the per-FV discovery files (index.json / pruefi_to_key.json /
        # ebd.schema.json) into each FV dir; this adds the one cross-FV manifest, which no single
        # (per-FV) matrix job can otherwise produce. We list the FV dirs present in the checkout
        # (this job's freshly-written FV included) and take valid_from from efoli — the authoritative
        # BDEW dates, which are NOT the FV label and not always the 1st (e.g. FV2504 -> 2025-06-06).
        # Existing-FV jobs recompute an identical manifest, so create-pull-request includes it only in
        # the PR of the job that actually adds/changes a format version; it self-heals on the next run.
        working-directory: machine-readable_entscheidungsbaumdiagramme
        run: |
          python3 -m pip install --quiet efoli
          python3 <<'PY'
          import json, os, re
          from efoli import EdifactFormatVersion, get_edifact_format_version_valid_from
          fvs = sorted(d for d in os.listdir(".") if re.fullmatch(r"FV\d{4}", d) and os.path.isdir(d))
          def valid_from(fv: str) -> str | None:
              try:
                  return get_edifact_format_version_valid_from(EdifactFormatVersion(fv)).isoformat()
              except ValueError:
                  return None  # FV not (yet) known to efoli
          data = {
              "latest": fvs[-1] if fvs else None,
              "format_versions": [{"format_version": fv, "valid_from": valid_from(fv)} for fv in fvs],
          }
          with open("format_versions.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(f"wrote format_versions.json with {len(fvs)} format versions")
          PY
      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          # we use this to have unique branch names
      - name: Push EBD files to machine-readable_entscheidungsbaumdiagramme
        uses: peter-evans/create-pull-request@v8
        with:
           path:  machine-readable_entscheidungsbaumdiagramme
           title: EDI@Energy ebd_amame & r_ebd_huhn changes (Triggered by ${{ github.event.head_commit.message }})
           token: ${{ secrets.MREBD_PUSH_TOKEN }} # this token expires on 2025-10-27
           # token with repo scope
           # https://github.com/Hochfrequenz/edi_energy_mirror/settings/secrets/actions/MREBD_PUSH_TOKEN
           branch: update-${{ steps.current-time.outputs.formattedTime }}
           reviewers: deltadaniel
           assignees: deltadaniel
