name: Run EBD_amame and r_EBD_huhn
on:
  push:
    branches:
      - master
    paths:
      - 'edi_energy_de/**/*.docx'
      - 'ebd-tooling/**'
      - '.github/workflows/ebdamame_rebdhuhn.yml'
jobs:
  check:
    name: Scrape ${{ matrix.output }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - output: FV2510
          - output: FV2604
          - output: FV2610
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          path: edi_energy_mirror
          lfs: true
      - uses: actions/checkout@v7
        with:
          # token expires 2026-05-16; has repo and read:packages scope
          token: ${{ secrets.MREBD_PUSH_TOKEN }}
          repository: Hochfrequenz/machine-readable_entscheidungsbaumdiagramme
          path: machine-readable_entscheidungsbaumdiagramme
      - name: login to GHCR
        # token expires 2026-05-16; has repo and read:package scope
        run: echo "${{ secrets.GHCR_PWD }}" | docker login ghcr.io -u ${{ secrets.GHCR_USR }} --password-stdin
      - name: Find latest EBD docx
        id: find-ebd
        # Files follow the naming convention from edi_energy_scraper's get_meaningful_file_name():
        # EBD_{version}_{valid_from}_{valid_to}_{publication_date}_{flags}_{id}.docx
        # The document ID is a sequential number assigned by the BDEW system; the highest ID
        # is therefore the most recently added document. We sort numerically by this ID.
        run: |
          latest=$(ls edi_energy_mirror/edi_energy_de/${{ matrix.output }}/EBD_*.docx 2>/dev/null \
            | awk -F'_' '{id=$NF; sub(/\.docx$/,"",id); print id+0, $0}' \
            | sort -n | awk '{print $2}' | tail -n1)
          if [ -z "$latest" ]; then
            echo "No EBD docx found in edi_energy_de/${{ matrix.output }}" >&2
            exit 1
          fi
          echo "Found latest EBD docx: $latest"
          # strip the "edi_energy_mirror/" prefix so the path is relative to edi_energy_mirror/ebd-tooling
          relative="../${latest#edi_energy_mirror/}"
          echo "docx=$relative" >> "$GITHUB_OUTPUT"
      - name: Run Extraction
        working-directory: edi_energy_mirror/ebd-tooling
        env:
          EBD_DOCX_FILE: ${{ steps.find-ebd.outputs.docx }}
          OUTPUT_DIR: ../../machine-readable_entscheidungsbaumdiagramme/${{ matrix.output }}
          GITHUB_TOKEN: ${{ secrets.XMLMIGSAHBS_READ_TOKEN }}
          FORMAT_VERSION: ${{ matrix.output }}
        run: docker compose up --abort-on-container-exit
      - name: Regenerate format_versions.json (enumerable FV list for AI/consumers)
        # ebd_toolchain emits the per-FV discovery files (index.json / pruefi_to_key.json /
        # ebd.schema.json) into each FV dir; this adds the one cross-FV manifest, which no single
        # (per-FV) matrix job can otherwise produce. We list the FV dirs present in the checkout
        # (this job's freshly-written FV included) and take valid_from from efoli — the authoritative
        # BDEW dates, which are NOT the FV label and not always the 1st (e.g. FV2504 -> 2025-06-06).
        # Existing-FV jobs recompute an identical manifest, so create-pull-request includes it only in
        # the PR of the job that actually adds/changes a format version; it self-heals on the next run.
        working-directory: machine-readable_entscheidungsbaumdiagramme
        run: |
          python3 -m pip install --quiet efoli
          python3 <<'PY'
          import json, os, re
          from efoli import EdifactFormatVersion, get_edifact_format_version_valid_from
          fvs = sorted(d for d in os.listdir(".") if re.fullmatch(r"FV\d{4}", d) and os.path.isdir(d))
          def valid_from(fv: str) -> str | None:
              try:
                  return get_edifact_format_version_valid_from(EdifactFormatVersion(fv)).isoformat()
              except ValueError:
                  return None  # FV not (yet) known to efoli
          data = {
              "latest": fvs[-1] if fvs else None,
              "format_versions": [{"format_version": fv, "valid_from": valid_from(fv)} for fv in fvs],
          }
          with open("format_versions.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(f"wrote format_versions.json with {len(fvs)} format versions")
          PY
      - name: Get current time
        uses: srfrnk/current-time@master
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          # we use this to have unique branch names
      - name: Push EBD files to machine-readable_entscheidungsbaumdiagramme
        uses: peter-evans/create-pull-request@v8
        with:
           path:  machine-readable_entscheidungsbaumdiagramme
           title: EDI@Energy ebd_amame & r_ebd_huhn changes (Triggered by ${{ github.event.head_commit.message }})
           token: ${{ secrets.MREBD_PUSH_TOKEN }} # this token expires on 2025-10-27
           # token with repo scope
           # https://github.com/Hochfrequenz/edi_energy_mirror/settings/secrets/actions/MREBD_PUSH_TOKEN
           branch: update-${{ steps.current-time.outputs.formattedTime }}
           reviewers: deltadaniel
           assignees: deltadaniel
